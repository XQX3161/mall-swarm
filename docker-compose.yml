version: '3.8'
services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: mall
    ports:
      - "3306:3306"
    volumes:
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
  app:
    build:
      context: .
      dockerfile: mall-app/Dockerfile
    depends_on:
      - db
    environment:
      - MYSQL_PASSWORD=password
    ports:
      - "8080:8080"
    restart: unless-stopped
